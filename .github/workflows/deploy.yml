name: AIO App CI Integration

on:
  push:
    branches:
      - integration
jobs:
  deploy:
    name: Deploy to Integration
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 1
      matrix:
        node-version: ['16']
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
      - name: npm install
        run: npm i
      - name: Setup CLI
        uses: adobe/aio-cli-setup-action@1.1.0
        with:
          os: ${{ matrix.os }}
          version: 9.x.x
      - name: Auth
        uses: adobe/aio-apps-action@2.0.2
        with:
          os: ${{ matrix.os }}
          command: auth
          CLIENTID: ${{ secrets.CLIENTID_INTEGRATION}}
          CLIENTSECRET: ${{ secrets.CLIENTSECRET_INTEGRATION }}
          TECHNICALACCOUNTID: ${{ secrets.TECHNICALACCID_INTEGRATION }}
          IMSORGID: ${{ secrets.IMSORGID_INTEGRATION }}
          SCOPES: ${{ secrets.SCOPES_INTEGRATION }}
          KEY: ${{ secrets.KEY_INTEGRATION }}
      - name: Build
        env:
          AIO_RUNTIME_NAMESPACE: ${{ secrets.AIO_RUNTIME_NAMESPACE_INTEGRATION }}
        uses: adobe/aio-apps-action@2.0.2
        with:
          os: ${{ matrix.os }}
          command: build
      - name: Deploy
        env:
          AIO_RUNTIME_NAMESPACE: ${{ secrets.AIO_RUNTIME_NAMESPACE_INTEGRATION }}
          AIO_RUNTIME_AUTH: ${{ secrets.AIO_RUNTIME_AUTH_INTEGRATION}}
          AIO_PROJECT_ID: ${{ secrets.AIO_PROJECT_ID_INTEGRATION }}
          AIO_PROJECT_NAME: ${{ secrets.AIO_PROJECT_NAME_INTEGRATION }}
          AIO_PROJECT_ORG_ID: ${{ secrets.AIO_PROJECT_ORG_ID_INTEGRATION }}
          AIO_PROJECT_WORKSPACE_ID: ${{ secrets.AIO_PROJECT_WORKSPACE_ID_INTEGRATION }}
          AIO_PROJECT_WORKSPACE_NAME: ${{ secrets.AIO_PROJECT_WORKSPACE_NAME_INTEGRATION }}
          AIO_PROJECT_WORKSPACE_DETAILS_SERVICES: ${{ secrets.AIO_PROJECT_WORKSPACE_DETAILS_SERVICES_INTEGRATION }}
        uses: adobe/aio-apps-action@2.0.2
        with:
          os: ${{ matrix.os }}
          command: deploy
          noPublish: true
